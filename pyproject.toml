[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cricassist"
version = "0.1.0"
description = "AI co-pilot for cricket journalists: ESPNcricinfo context plus an offline ball-by-ball stats database."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.1", "google-genai>=1.30", "anthropic>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cricassist = "cricassist.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.package-data]
cricassist = ["stats/dataset/*.json"]
