<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CricAssist</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <!-- Shared drawings: the leather ball (the dot on each i) and the bat (the last t). -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <radialGradient id="leather" cx="35%" cy="30%" r="75%">
        <stop offset="0%" stop-color="#f05a47"/>
        <stop offset="45%" stop-color="#c0261b"/>
        <stop offset="100%" stop-color="#6a0f0a"/>
      </radialGradient>
      <linearGradient id="willow" x1="0" x2="1" y1="0" y2="0">
        <stop offset="0%" stop-color="#c99a5b"/>
        <stop offset="35%" stop-color="#f3dcaa"/>
        <stop offset="65%" stop-color="#ecd09a"/>
        <stop offset="100%" stop-color="#b8874a"/>
      </linearGradient>
      <linearGradient id="grip" x1="0" x2="1">
        <stop offset="0%" stop-color="#0d4a34"/>
        <stop offset="50%" stop-color="#1c7a55"/>
        <stop offset="100%" stop-color="#0d4a34"/>
      </linearGradient>
      <symbol id="ball" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="46" fill="url(#leather)"/>
        <path d="M30 8 C 52 32, 52 68, 30 92" fill="none" stroke="#f6e7c8" stroke-width="3.2" stroke-linecap="round"/>
        <path d="M40 5 C 63 30, 63 70, 40 95" fill="none" stroke="#f6e7c8" stroke-width="3.2" stroke-linecap="round"/>
        <path d="M30 8 C 52 32, 52 68, 30 92" fill="none" stroke="#f6e7c8" stroke-width="9" stroke-dasharray="1.6 6" opacity=".75" transform="translate(-4 0)"/>
        <path d="M40 5 C 63 30, 63 70, 40 95" fill="none" stroke="#f6e7c8" stroke-width="9" stroke-dasharray="1.6 6" opacity=".75" transform="translate(4 0)"/>
        <ellipse cx="33" cy="28" rx="13" ry="8" fill="#fff" opacity=".28" transform="rotate(-30 33 28)"/>
      </symbol>
      <!-- A bat standing as the letter t: a short handle above, the shoulders as the
           cross-stroke, the blade as the stem, toe on the baseline. -->
      <symbol id="bat" viewBox="0 0 52 100">
        <rect x="21.5" y="1" width="9" height="30" rx="4" fill="url(#grip)"/>
        <g stroke="#0a3a29" stroke-width="1.3" opacity=".55">
          <line x1="22" y1="8" x2="30" y2="5"/><line x1="22" y1="15" x2="30" y2="12"/>
          <line x1="22" y1="22" x2="30" y2="19"/><line x1="22" y1="29" x2="30" y2="26"/>
        </g>
        <path d="M2 36.5 Q 2 30 9 30 L 43 30 Q 50 30 50 36.5 Q 50 42 43.5 43 L 39 44
                 L 38 92 Q 38 99 26 99 Q 14 99 14 92 L 13 44 L 8.5 43 Q 2 42 2 36.5 Z"
              fill="url(#willow)" stroke="#8a6331" stroke-width="1.3"/>
        <path d="M26 47 L 26 92" stroke="#b98a4c" stroke-width="1.4" opacity=".5"/>
        <rect x="16" y="54" width="20" height="7" rx="1.5" fill="#0f5a3f" opacity=".85"/>
      </symbol>
    </defs>
  </svg>

  <template id="wordmark">
    <span class="wordmark" role="img" aria-label="CricAssist">
      <span class="ch" style="--n:0">C</span><span class="ch" style="--n:1">r</span><span class="ch i" style="--n:2">ı<svg class="ball" aria-hidden="true"><use href="#ball"/></svg></span><span class="ch" style="--n:3">c</span><span class="ch cap" style="--n:4">A</span><span class="ch" style="--n:5">s</span><span class="ch" style="--n:6">s</span><span class="ch i" style="--n:7">ı<svg class="ball" aria-hidden="true"><use href="#ball"/></svg></span><span class="ch" style="--n:8">s</span><span class="ch bat" style="--n:9"><svg aria-hidden="true"><use href="#bat"/></svg></span>
    </span>
  </template>

  <div id="splash" class="splash" aria-hidden="true">
    <div class="pitch"></div>
    <div class="splash-inner">
      <div class="splash-logo" data-wordmark></div>
      <p class="tagline">Cricket stats you can quote</p>
      <div class="loader"><span></span></div>
    </div>
  </div>

  <div id="app" class="app" hidden>
    <aside id="sidebar" class="sidebar">
      <div class="side-top">
        <div class="side-logo" data-wordmark></div>
        <button id="newChat" class="new-chat" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          New chat
        </button>
      </div>
      <nav class="sessions" aria-label="Chats">
        <ul id="sessionList"></ul>
      </nav>
      <div class="side-foot">
        Stats from Cricsheet ball-by-ball data.<br>Every number comes from the database.
      </div>
    </aside>
    <div id="scrim" class="scrim"></div>

    <main class="main">
      <header class="topbar">
        <button id="menu" class="icon-btn menu" type="button" aria-label="Show chats">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <label class="picker">
          <span class="sr-only">Model</span>
          <select id="model"></select>
        </label>
        <span id="status" class="status"></span>
      </header>

      <section id="thread" class="thread" aria-live="polite"></section>

      <form id="composer" class="composer" autocomplete="off">
        <div class="composer-box">
          <textarea id="input" rows="1" placeholder="Ask about players, teams, venues or records…" aria-label="Your question"></textarea>
          <button id="send" class="send" type="submit" aria-label="Send" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </div>
        <p class="hint">Enter to send, Shift+Enter for a new line. Answers come only from the stats database.</p>
      </form>
    </main>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
